<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>매물장 진단</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:#f6f5f3;color:#1c1917;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    letter-spacing:-.02em;padding:18px 14px 60px}
  h1{font-size:20px;margin:0 0 4px;letter-spacing:-.03em}
  p.sub{margin:0 0 18px;color:#78716c;font-size:13px}
  .card{background:#fff;border:1px solid #e7e5e4;border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .card h2{font-size:14px;margin:0 0 10px;color:#44403c}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:6px 0;border-bottom:1px solid #f5f5f4;vertical-align:top}
  td:first-child{color:#78716c;white-space:nowrap;padding-right:12px;width:45%}
  td:last-child{font-weight:700;text-align:right;word-break:break-all}
  .ok{color:#15803d}.bad{color:#b91c1c}.warn{color:#b45309}
  pre{white-space:pre-wrap;word-break:break-all;background:#fafaf9;border:1px solid #e7e5e4;
    border-radius:10px;padding:10px;font-size:12px;margin:0;color:#44403c}
  .note{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 14px;
    font-size:13px;color:#92400e;margin-bottom:14px}
  button{width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;
    background:#1c1917;color:#fff;margin-top:6px}
</style>
</head>
<body>
<h1>매물장 진단</h1>
<p class="sub">이 기기에 무엇이 들어 있는지만 봅니다. 아무것도 바꾸지 않습니다.</p>

<div class="note">
  연락처·이름·전화번호는 <b>표시하지 않습니다.</b> 건수와 오류만 나옵니다.<br>
  이 화면을 찍어서 보내 주세요.
</div>

<div class="card"><h2>이 기기에 저장된 매물</h2><table id="store"></table></div>
<div class="card"><h2>홈페이지에서 받은 기본 자료</h2><table id="files"></table></div>
<div class="card"><h2>기기·화면</h2><table id="env"></table></div>
<div class="card"><h2>오류</h2><pre id="errs">없음</pre></div>
<button onclick="location.reload()">다시 검사</button>

<script>
var errors = [];
window.addEventListener('error', function (e) { errors.push(String(e.message)); paint(); });
function esc(v){ return String(v).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function row(t, label, value, cls){
  var tr = document.createElement('tr');
  var a = document.createElement('td'); a.textContent = label;
  var b = document.createElement('td'); b.textContent = value; if (cls) b.className = cls;
  tr.append(a, b); t.appendChild(tr);
}
function paint(){ document.getElementById('errs').textContent = errors.length ? errors.join('\n') : '없음'; }

(function () {
  var t = document.getElementById('store');
  var keys = [], total = 0, best = null, bestN = -1;
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      var v = localStorage.getItem(k) || '';
      total += k.length + v.length;
      if (/^SMART_BROKER_PROPERTIES_V\d+$/.test(k)) {
        var n = '읽기 실패';
        try { var a = JSON.parse(v); n = Array.isArray(a) ? a.length : '배열 아님'; } catch (e) { n = '깨진 값'; }
        keys.push([k, n]);
        if (typeof n === 'number' && n > bestN) { bestN = n; best = k; }
      }
    }
  } catch (e) { errors.push('저장소를 읽지 못했습니다: ' + e.message); }

  if (!keys.length) row(t, '매물 저장소', '하나도 없음', 'bad');
  keys.sort(function (a, b) { return Number(b[0].split('_V').pop()) - Number(a[0].split('_V').pop()); });
  keys.forEach(function (kv) {
    var cls = (typeof kv[1] === 'number' && kv[1] > 0) ? 'ok' : 'bad';
    row(t, kv[0].replace('SMART_BROKER_PROPERTIES_', '매물 '), kv[1] + (typeof kv[1] === 'number' ? '건' : ''), cls);
  });
  row(t, '저장소 전체 크기', Math.round(total / 1024) + ' KB');
  try {
    var c = localStorage.getItem('SMART_BROKER_CLIENTS_V1');
    var cn = c ? (JSON.parse(c) || []).length : 0;
    row(t, '손님(고객장)', cn + '건');
  } catch (e) { row(t, '손님(고객장)', '깨진 값', 'bad'); }
  var login = null;
  try { login = localStorage.getItem('SONG_REALESTATE_USER_LOGIN_V5'); } catch (e) {}
  row(t, '로그인된 계정', login || '없음');

  // 저장 공간이 꽉 찼는지
  // 1바이트가 아니라 매물장 한 벌 크기(약 600KB)를 써 봐야 진짜 여유를 압니다
  try {
    var probe = new Array(600 * 1024).join('x');
    localStorage.setItem('__jindan__', probe);
    localStorage.removeItem('__jindan__');
    row(t, '저장 공간', '여유 있음 (600KB 써 봄)', 'ok');
  } catch (e) {
    try { localStorage.removeItem('__jindan__'); } catch (e2) {}
    row(t, '저장 공간', '모자람 — 매물장 한 벌을 못 씁니다', 'bad');
  }
  var legacy = keys.filter(function (kv) { return true; }).length;
  if (legacy >= 3) row(t, '예전 사본 개수', legacy + '개 — 공간을 많이 씁니다', 'warn');
})();

(function () {
  var t = document.getElementById('files');
  var s = document.createElement('script');
  s.src = 'properties_data.js?j=' + Date.now();
  s.onload = function () {
    var n = (typeof INITIAL_PROPERTY_DATA !== 'undefined' && INITIAL_PROPERTY_DATA) ? INITIAL_PROPERTY_DATA.length : 0;
    row(t, 'properties_data.js', n > 0 ? ('읽음 · ' + n + '건') : '읽었지만 비어 있음', n > 0 ? 'ok' : 'bad');
  };
  s.onerror = function () { row(t, 'properties_data.js', '받지 못함', 'bad'); errors.push('properties_data.js 를 받지 못했습니다'); paint(); };
  document.body.appendChild(s);

  var s2 = document.createElement('script');
  s2.src = 'js/plan3d.js?j=' + Date.now();
  s2.onload = function () { row(t, 'js/plan3d.js', window.Plan3D ? '읽음' : '읽었지만 비어 있음', window.Plan3D ? 'ok' : 'bad'); };
  s2.onerror = function () { row(t, 'js/plan3d.js', '받지 못함', 'bad'); };
  document.body.appendChild(s2);
})();

(function () {
  var t = document.getElementById('env');
  row(t, '화면 가로', window.innerWidth + ' px');
  row(t, '주소', location.pathname);
  row(t, '브라우저', (navigator.userAgent.match(/(SamsungBrowser|Chrome|CriOS|Firefox|Safari)\/[\d.]+/) || ['알 수 없음'])[0]);
  row(t, '비공개 모드 의심', (function () {
    try { localStorage.setItem('__p__', '1'); localStorage.removeItem('__p__'); return '아님'; }
    catch (e) { return '그럴 수 있음'; }
  })());
  row(t, '검사 시각', new Date().toLocaleString('ko-KR'));
})();
paint();
</script>
</body>
</html>
