<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>인천 홈앤비즈 | 보안 연락처</title>
<style>body{font:16px system-ui,sans-serif;background:#f4f7fb;color:#18283d;margin:0}main{max-width:760px;margin:30px auto;padding:16px}section{background:white;border:1px solid #dce4ef;border-radius:16px;padding:20px;margin:15px 0}label{display:block;font-size:14px;margin:12px 0 5px}input,select,button{box-sizing:border-box;font:inherit;padding:12px;border-radius:9px}input,select{width:100%;border:1px solid #c7d2e0}button{border:0;background:#174c8c;color:white;cursor:pointer;margin:10px 5px 0 0}button:disabled{opacity:.5}small{color:#52677e}#status{white-space:pre-wrap}a{color:#174c8c}</style></head><body>
<main><h1>🔒 인천 홈앤비즈 보안 연락처</h1>
<p><a href="ledger.html">← 기존 매물장으로</a></p>
<section><p>기존 피클·GitHub 매물 등록은 변경하지 않습니다. 공개 매물번호로 보안 연락처를 연결합니다.</p><small>직원 계정은 Supabase Authentication에서 생성하고, 관리자가 직원 권한을 승인해야 합니다. 승인된 직원 계정으로 로그인하세요.</small></section>
<section id="login"><h2>직원 로그인</h2><form id="loginForm"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button>로그인</button></form></section>
<section id="editor" hidden><h2>매물별 비공개 연락처</h2><p id="account"></p><button id="logout" type="button">로그아웃</button>
<p id="catalogCount"></p><form id="lookupForm"><label for="listing">기존 매물번호 (예: P-YSJ-36)</label><input id="listing" list="listingSuggestions" required maxlength="100"><datalist id="listingSuggestions"></datalist><button>매물 조회</button></form><div id="adminTools" hidden><label for="assignee">담당 직원 계정 ID (승인된 직원만 표시)</label><select id="assignee"></select><button id="connectListing" type="button">공개 매물번호 연결</button><button id="assignListing" type="button">조회한 매물 담당자 변경</button></div>
<form id="contactForm" hidden><h3 id="listingTitle"></h3><label for="landlordName">임대인 이름</label><input id="landlordName" maxlength="100"><label for="landlordPhone">임대인 전화번호</label><input id="landlordPhone" type="tel" maxlength="30"><label for="tenantName">임차인 이름</label><input id="tenantName" maxlength="100"><label for="tenantPhone">임차인 전화번호</label><input id="tenantPhone" type="tel" maxlength="30"><label for="memo">비공개 메모</label><input id="memo" maxlength="2000"><button>보안 DB에 저장</button></form></section>
<section><strong>상태</strong><p id="status" role="status" aria-live="polite">연결 준비 중</p></section>
</main><script type="module" src="js/secure-ledger.js"></script></body></html>
