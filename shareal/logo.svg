<svg viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 인천홈 비비드 크림슨 레드 -->
    <linearGradient id="nhRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A2A"/>
      <stop offset="100%" stop-color="#D90429"/>
    </linearGradient>

    <!-- 인천비즈 울트라 로열 블루 -->
    <linearGradient id="nhBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0038B8"/>
      <stop offset="100%" stop-color="#002080"/>
    </linearGradient>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.08" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- 1. 인피니티 심볼 마크 (레드 인천홈 + 블루 인천비즈) -->
  <!-- ======================================================== -->
  <g transform="translate(10, 15)" filter="url(#softGlow)">
    <!-- [좌측 루프: 레드 링 & 리본] -->
    <!-- 두께 24px의 매끄러운 원형 루프와 교차 브릿지 -->
    <path d="M 130 50 C 112 22, 85 10, 52 10 C 23.3 10, 0 33.3, 0 62 C 0 90.7, 23.3 114, 52 114 C 85 114, 112 102, 130 74 L 148 94 C 122 128, 89 138, 52 138 C 10 138, -24 104, -24 62 C -24 20, 10 -14, 52 -14 C 89 -14, 122 -4, 148 30 Z" 
          transform="translate(40, 13)" fill="url(#nhRed)"/>

    <!-- [우측 루프: 블루 링 & 리본 (좌측과 크로스오버)] -->
    <path d="M 90 50 C 108 22, 135 10, 168 10 C 196.7 10, 220 33.3, 220 62 C 220 90.7, 196.7 114, 168 114 C 135 114, 108 102, 90 74 L 72 94 C 98 128, 131 138, 168 138 C 210 138, 244 104, 244 62 C 244 20, 210 -14, 168 -14 C 131 -14, 98 -4, 72 30 Z" 
          transform="translate(40, 13)" fill="url(#nhBlue)"/>

    <!-- 중앙 교차 영역 매끄러운 겹침 처리 (화이트 컷아웃 마진으로 입체감 분리) -->
    <path d="M 166 42 L 194 76 L 176 96 L 148 62 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M 168 44 L 192 74 L 176 94 L 152 64 Z" fill="url(#nhBlue)"/>

    <!-- ============================================== -->
    <!-- [좌측 내부: 심플 볼드 하우스 실루엣 (레드)] -->
    <!-- ============================================== -->
    <g transform="translate(68, 52)" fill="url(#nhRed)">
      <!-- 지붕 (처마가 강조된 모던 박공 스타일) -->
      <path d="M 24 0 L 48 18 L 44 22 L 24 7 L 4 22 L 0 18 Z"/>
      <!-- 기둥 및 벽체 바디 -->
      <path d="M 5 21 L 11 21 L 11 38 L 37 38 L 37 21 L 43 21 L 43 44 L 5 44 Z"/>
    </g>

    <!-- ============================================== -->
    <!-- [우측 내부: 스카이라인 빌딩 심볼 (블루)] -->
    <!-- ============================================== -->
    <g transform="translate(184, 46)" fill="url(#nhBlue)">
      <!-- 좌측 고층 타워 (윤곽선 프레임) -->
      <path d="M 6 0 L 26 0 L 26 50 L 20 50 L 20 7 L 12 7 L 12 50 L 6 50 Z"/>
      <!-- 우측 중간 빌딩 (솔리드 블록) -->
      <path d="M 23 20 L 40 20 L 40 50 L 23 50 Z M 28 26 L 35 26 L 35 44 L 28 44 Z" fill="#FFFFFF"/>
      <path d="M 26 23 L 42 23 L 42 50 L 26 50 Z"/>
      <rect x="31" y="29" width="6" height="15" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 2. 브랜드 워드마크: '인천 홈앤비즈' (초고선명 울트라 볼드 블루) -->
  <!-- ======================================================== -->
  <g transform="translate(320, 106)">
    <text font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="-1.5px" 
          fill="#002D9C">
      인천 홈앤비즈
    </text>
  </g>
</svg>
